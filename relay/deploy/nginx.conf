# RemoteDesk relay — nginx reverse proxy. TLS is added by
#   sudo certbot --nginx -d remote.tuandv.id.vn --cert-name remote-desk --redirect

limit_req_zone $binary_remote_addr zone=remotedesk_auth:10m rate=2r/s;

map $http_upgrade $remotedesk_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name remote.tuandv.id.vn;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location = /login {
        limit_req zone=remotedesk_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Long-lived WebSockets: agent and viewer. No buffering, generous timeouts
    # (the relay pings every 20 s).
    location /ws/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $remotedesk_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        tcp_nodelay on;
    }

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }

    listen 80;
}
